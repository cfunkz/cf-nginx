name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck dpkg-dev

      - name: Lint
        run: make lint

      - name: Build .deb and source zip
        run: make dist

      - name: Check the package
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^readonly VERSION="\(.*\)"/\1/p' bin/cf-nginx)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cf-nginx-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION in bin/cf-nginx
        id: version
        run: |
          version=$(sed -n 's/^readonly VERSION="\(.*\)"/\1/p' bin/cf-nginx)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION=\"$version\" in bin/cf-nginx"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: cf-nginx-${{ steps.version.outputs.version }}
          path: dist

      - name: Add stable-name copy for /releases/latest/download links
        run: cp "dist/cf-nginx_${{ steps.version.outputs.version }}_all.deb" dist/cf-nginx_all.deb

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "cf-nginx $TAG" --generate-notes
          fi
