# /etc/cf-nginx/cf-nginx.conf
#
# KEY=value, one per line. This file is parsed as data (never executed).
# After editing, apply with:  sudo cf-nginx update

# Where Cloudflare publishes its ranges. https:// (or file:// for a local mirror).
IPS_V4_URL=https://www.cloudflare.com/ips-v4
IPS_V6_URL=https://www.cloudflare.com/ips-v6
ENABLE_IPV6=yes

# Restore the real visitor IP for *every* server block (http level).
# Toggle with: cf-nginx global-real-ip on|off
GLOBAL_REAL_IP=no

# Header carrying the visitor IP. CF-Connecting-IP is right for almost everyone.
REAL_IP_HEADER=CF-Connecting-IP

# origin-lock.conf: extra addresses/CIDRs allowed besides Cloudflare
# (space separated), the status returned to everyone else (403, or 444 to
# drop the connection) and whether ACME HTTP-01 challenges may bypass the lock.
ORIGIN_LOCK_ALLOW="127.0.0.1 ::1"
ORIGIN_LOCK_STATUS=403
ORIGIN_LOCK_ACME_BYPASS=yes

# Authenticated Origin Pulls (mTLS). Toggle with: cf-nginx origin-pull on|off
ORIGIN_PULL_CA=no
ORIGIN_PULL_CA_URL=https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem

# UFW: allow these TCP ports only from Cloudflare. Toggle with: cf-nginx ufw on|off
UFW_SYNC=no
UFW_PORTS=80,443

# Safety valve: refuse an update if a list shrinks by more than this percent.
MAX_SHRINK_PERCENT=50

# Leave empty to auto-detect (from `nginx -V`).
NGINX_BIN=
NGINX_CONF_DIR=
